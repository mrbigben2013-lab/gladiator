<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>bow shape probe</title>
<style>
  body { background:#1b1512; margin:0; padding:8px; font-family:Segoe UI, sans-serif; }
  .row { display:flex; flex-wrap:wrap; gap:6px; }
  .cap { font-size:12px; color:#c9a45c; text-align:center; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script src="data.js"></script>
<script src="renderer.js"></script>
<script>
  function cell(id) {
    const wrap = document.createElement('div');
    const cv = document.createElement('canvas');
    cv.width = 300; cv.height = 340;
    wrap.appendChild(cv);
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = id;
    wrap.appendChild(cap);
    document.getElementById('row').appendChild(wrap);
    const ctx = cv.getContext('2d');
    // центр клетки — точка кисти (0,0) в drawWeapon
    ctx.save();
    ctx.translate(150, 170);
    ctx.strokeStyle = 'rgba(120,200,255,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-140, 0); ctx.lineTo(140, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -160); ctx.lineTo(0, 160); ctx.stroke();
    ctx.fillStyle = 'rgba(255,80,80,0.9)';
    ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
    ctx.scale(2, 2);
    drawWeapon(ctx, itemById(id));
    ctx.restore();
  }
  ['w_shortbow', 'w_longbow', 'w_recurve', 'w_light_xbow'].forEach(cell);
</script>
</body>
</html>
