<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>bow zoom</title>
<style>
  body { background:#1b1512; margin:0; padding:8px; font-family:Segoe UI, sans-serif; }
  .row { display:flex; flex-wrap:wrap; gap:6px; }
  .cap { font-size:12px; color:#c9a45c; text-align:center; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script src="data.js"></script>
<script src="renderer.js"></script>
<script>
  const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
  function makeGlad(weaponId) {
    return {
      id: 'tg', name: 'Тест', gender: 'male', build: 'normal',
      skinColor: '#e8ab7e', hairColor: '#4a3018',
      hairStyle: 'short', beardStyle: 'none',
      equip: { weapon: itemById(weaponId), offhand: null, head: null, body: null, arms: null, legs: null },
      limbs: null
    };
  }
  const ids = ['w_shortbow', 'w_longbow', 'w_recurve', 'w_phoenix'];
  ids.forEach(id => {
    const wrap = document.createElement('div');
    const cv = document.createElement('canvas');
    cv.width = 420; cv.height = 520;
    wrap.appendChild(cv);
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = itemById(id).name;
    wrap.appendChild(cap);
    document.getElementById('row').appendChild(wrap);
    const ctx = cv.getContext('2d');
    ctx.save();
    ctx.translate(210, 40);
    ctx.scale(2.4, 2.4);
    drawBattleBrother(ctx, makeGlad(id), 0, 175, 1, 1, { walk: 0 });
    ctx.restore();
  });
</script>
</body>
</html>
