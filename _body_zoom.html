<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>body zoom</title>
<style>
  body { background:#1b1512; margin:0; padding:10px; font-family:Segoe UI, sans-serif; color:#e8d8c0; }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  .cell { text-align:center; }
  .cap { font-size:12px; color:#c9a45c; }
  #err { color:#ff8a7a; font-size:12px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="err"></div>
<div class="row" id="row"></div>
<script src="data.js"></script>
<script src="renderer.js"></script>
<script>
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  function makeGlad(over) {
    return Object.assign({
      id: 'tg', name: 'Тест', gender: 'male', build: 'normal',
      skinColor: '#e8ab7e', hairColor: '#4a3018',
      hairStyle: 'short', beardStyle: 'none',
      equip: { weapon: null, offhand: null, head: null, body: null, arms: null, legs: null },
      limbs: null
    }, over);
  }
  const cases = [
    ['male naked',   { gender:'male', build:'normal' }],
    ['male muscular',{ gender:'male', build:'muscular', beardStyle:'stubble' }],
    ['male heavy',   { gender:'male', build:'heavy', hairStyle:'bald', beardStyle:'full' }],
    ['male slim',    { gender:'male', build:'slim', hairStyle:'ponytail' }],
    ['female naked', { gender:'female', hairStyle:'long', skinColor:'#f5c9a4' }],
    ['female muscular',{ gender:'female', build:'muscular', hairStyle:'braids' }],
    ['tunic',        { gender:'male' }, { body:'tunic' }],
    ['leather',      { gender:'male' }, { body:'leather' }],
    ['mail',         { gender:'male' }, { body:'mail' }],
    ['lorica',       { gender:'male' }, { body:'lorica' }],
    ['medieval',     { gender:'male' }, { body:'medieval' }],
    ['gothic',       { gender:'male' }, { body:'gothic' }],
    ['knight full',  { gender:'male' }, { body:'medieval', head:'bascinet', arms:'medieval', legs:'medieval' }],
    ['legion full',  { gender:'male' }, { body:'lorica', head:'murmillo', arms:'manica', legs:'greaves' }]
  ];
  cases.forEach(([label, over, eqVis]) => {
    const wrap = document.createElement('div');
    wrap.className = 'cell';
    const cv = document.createElement('canvas');
    cv.width = 210; cv.height = 400;
    wrap.appendChild(cv);
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = label;
    wrap.appendChild(cap);
    document.getElementById('row').appendChild(wrap);
    const ctx = cv.getContext('2d');
    const equip = { weapon: null, offhand: null, head: null, body: null, arms: null, legs: null };
    if (eqVis) {
      Object.keys(eqVis).forEach(slot => {
        const found = itemsBySlot(slot).find(i => i.vis === eqVis[slot]);
        equip[slot] = found ? { vis: found.vis, color: found.color, trim: found.trim, armor: found.armor } : { vis: eqVis[slot], color: '#8a7a66' };
      });
    }
    try {
      ctx.save();
      ctx.translate(105, 370);
      ctx.scale(2.0, 2.0);
      drawBattleBrother(ctx, makeGlad(Object.assign({}, over, { equip })), 0, 0, 1, 1, { emotion: 'idle' });
      ctx.restore();
    } catch (e) { document.getElementById('err').textContent += label + ': ' + e.message + '\n'; }
  });
</script>
</body>
</html>
