<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>combat vs deploy</title>
<style>
  body { background:#1b1512; margin:0; padding:8px; font-family:Segoe UI, sans-serif; }
  .row { display:flex; flex-wrap:wrap; gap:6px; }
  .cell { text-align:center; }
  .cap { font-size:11px; color:#c9a45c; height:14px; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script src="data.js"></script>
<script src="renderer.js"></script>
<script>
  const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
  function makeGlad(over) {
    return Object.assign({
      id: 'tg', name: 'Тест', gender: 'male', build: 'normal',
      skinColor: '#e8ab7e', hairColor: '#4a3018',
      hairStyle: 'short', beardStyle: 'full',
      equip: { weapon: null, offhand: null, head: null, body: null, arms: null, legs: null },
      limbs: null
    }, over);
  }
  const cases = [
    ['deploy', { walk: 0.08, walkPhase: 1.2, breath: 1.3, emotion: 'idle' }],
    ['combat idle', { walk: 0, walkPhase: 0, breath: 1.2, emotion: 'idle' }],
    ['combat swing', { walk: 0, walkPhase: 0, swing: 0.7, breath: 1.2, emotion: 'angry' }],
    ['combat walk', { walk: 0.8, walkPhase: 2.0, breath: 1.2, emotion: 'idle' }]
  ];
  const row = document.getElementById('row');
  ['w_gladius','w_spear','w_shortbow','w_hatchet'].forEach(wid => {
    cases.forEach(([label, anim]) => {
      const wrap = document.createElement('div');
      wrap.className = 'cell';
      const cv = document.createElement('canvas');
      cv.width = 200; cv.height = 250;
      wrap.appendChild(cv);
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = itemById(wid).name + ' / ' + label;
      wrap.appendChild(cap);
      row.appendChild(wrap);
      const ctx = cv.getContext('2d');
      const g = makeGlad({
        id: 'g_' + wid + label,
        equip: { weapon: itemById(wid), offhand: null, head: null, body: null, arms: null, legs: null }
      });
      ctx.save();
      ctx.translate(100, 0);
      ctx.scale(1.7, 1.7);
      for (let k = 0; k < 80; k++) {
        drawBattleBrother(ctx, g, 0, 130, 0.6, 1, anim);
      }
      ctx.restore();
    });
  });
</script>
</body>
</html>
