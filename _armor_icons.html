<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>armor icons</title>
<style>
  body { background:#1d1712; margin:0; padding:8px; font-family:Segoe UI, sans-serif; }
  .grid { display:flex; flex-wrap:wrap; gap:6px; }
  .cell { width:160px; text-align:center; }
  .cell canvas { background:#2a211a; border:1px solid #4a3a26; border-radius:6px; display:block; }
  .cap { font-size:10px; color:#c9a45c; margin-top:2px; height:14px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script src="data.js"></script>
<script src="renderer.js"></script>
<script>
  const slots = ['head','body','arms','legs'];
  const grid = document.getElementById('grid');
  slots.forEach(slot => {
    itemsBySlot(slot).forEach(item => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const cv = document.createElement('canvas');
      cv.width = 160; cv.height = 160;
      cell.appendChild(cv);
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.textContent = item.name + ' [' + item.vis + ']';
      cell.appendChild(cap);
      grid.appendChild(cell);
      const ctx = cv.getContext('2d');
      drawItemIcon(ctx, item, 80, 80, 150);
    });
  });
</script>
</body>
</html>
