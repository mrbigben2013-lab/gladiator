<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>faces zoom</title>
<style>
  body { background:#1b1512; margin:0; padding:8px; font-family:Segoe UI, sans-serif; color:#e8d8c0; }
  .row { display:flex; flex-wrap:wrap; gap:6px; }
  .cell { text-align:center; }
  .cap { font-size:12px; color:#c9a45c; height:15px; }
  h3 { font-size:13px; color:#e5b54f; margin:8px 0 4px; }
  #err { color:#ff8a7a; font-size:12px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="err"></div>
<h3>Бороды (крупно)</h3><div class="row" id="beards"></div>
<h3>Причёски (крупно)</h3><div class="row" id="hairs"></div>
<script src="data.js"></script>
<script src="renderer.js"></script>
<script>
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const errBox = document.getElementById('err');
  function report(e, label) {
    errBox.textContent += label + ': ' + e.message + '\n' + (e.stack || '').split('\n').slice(1, 3).join('\n') + '\n';
  }
  function makeGlad(over) {
    return Object.assign({
      id: 'tg', name: 'Тест', gender: 'male', build: 'normal',
      skinColor: '#e8ab7e', hairColor: '#4a3018',
      hairStyle: 'short', beardStyle: 'none',
      equip: { weapon: null, offhand: null, head: null, body: null, arms: null, legs: null },
      limbs: null
    }, over);
  }
  function cell(parent, label, glad) {
    const wrap = document.createElement('div');
    wrap.className = 'cell';
    const cv = document.createElement('canvas');
    cv.width = 190; cv.height = 230;
    wrap.appendChild(cv);
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = label;
    wrap.appendChild(cap);
    parent.appendChild(wrap);
    const ctx = cv.getContext('2d');
    try {
      ctx.save();
      ctx.translate(95, 20);
      ctx.scale(2.3, 2.3);
      drawBattleBrother(ctx, glad, 0, 150, 1, 1, { emotion: 'idle' });
      ctx.restore();
    } catch (e) { report(e, label); }
  }
  const beards = BEARD_STYLES.map(b => b.id);
  beards.forEach(b => cell(document.getElementById('beards'), b, makeGlad({ beardStyle: b, hairStyle: 'bald' })));
  const hairs = HAIR_STYLES.map(h => h.id);
  hairs.forEach(h => cell(document.getElementById('hairs'), h, makeGlad({ hairStyle: h })));
</script>
</body>
</html>
