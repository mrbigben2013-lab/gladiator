<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Диагностика</title>
<style>
  body { margin: 0; background: #14100d; color: #e8dcc8; font: 13px "Segoe UI", sans-serif; padding: 10px; }
  canvas { background: #241c15; border: 1px solid #4a3a28; }
  #log { white-space: pre-wrap; color: #ffb27a; }
</style>
</head>
<body>
<canvas id="cv" width="400" height="500"></canvas>
<div id="log"></div>
<script src="data.js"></script>
<script>window.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };</script>
<script src="renderer.js"></script>
<script>
const log = [];
function say(s) { log.push(s); document.getElementById('log').textContent = log.join('\n'); }
window.onerror = (m, f, l) => say('GLOBAL ERROR: ' + m + ' @' + l);

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const g = {
  id: 'test_glad_1', name: 'T', gender: 'male', build: 'normal',
  skinColor: '#e8ab7e', hairColor: '#4a3018', hairStyle: 'short', beardStyle: 'full',
  equip: {}
};

// 1) Голова отдельно
try {
  ctx.save();
  ctx.translate(100, 120);
  drawHead(ctx, g, 0, 26, '#e8ab7e', '#c98d63', false, {}, { hp: 100, max: 100, lost: false, ratio: 1 });
  ctx.restore();
  say('drawHead: OK');
} catch (e) {
  say('drawHead FAIL: ' + e.message + '\n' + (e.stack || '').split('\n').slice(0, 4).join('\n'));
}

// 2) Полная фигура
try {
  drawBattleBrother(ctx, g, 260, 460, 2.0, 1, {});
  say('drawBattleBrother: OK');
} catch (e) {
  say('drawBattleBrother FAIL: ' + e.message + '\n' + (e.stack || '').split('\n').slice(0, 4).join('\n'));
}

say('resetLimbs: ' + (typeof resetLimbs));
say('clamp: ' + (typeof clamp));
</script>
</body>
</html>
