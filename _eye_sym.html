<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Симметрия глаз</title>
<style>
  body { margin:0; background:#14100d; color:#e8dcc8; font:12px "Segoe UI", sans-serif; padding:12px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start; }
  canvas { background:#241c15; border:1px solid #4a3a28; border-radius:8px; image-rendering:pixelated; }
  .cap { color:#b9a687; font-size:11px; padding:2px 0 8px; }
  .out { font-family:Consolas, monospace; font-size:11px; white-space:pre; color:#cfe8c8; }
</style>
</head>
<body>
<div class="row">
  <div>
    <div class="cap">Голова (спокойные глаза)</div>
    <canvas id="face" width="420" height="320"></canvas>
  </div>
  <div>
    <div class="cap">Разница левой и отражённой правой половины</div>
    <canvas id="diff" width="420" height="320"></canvas>
  </div>
  <div>
    <div class="cap">Отчёт</div>
    <div class="out" id="rep">…</div>
  </div>
</div>
<script src="data.js?t=99"></script>
<script>window.clamp = function (v,a,b){return Math.max(a,Math.min(b,v));};</script>
<script src="renderer.js?t=99"></script>
<script>
const base = {
  id:'eye_test', name:'Тест', gender:'male', build:'normal',
  skinColor:'#e8ab7e', hairColor:'#4a3018',
  hairStyle:'short', beardStyle:'none', faceStyle:'classic',
  eyeStyle:'calm', noseStyle:'straight', browStyle:'natural', mouthStyle:'neutral',
  equip:{}
};

function renderFace(cv, glad) {
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const cx = cv.width/2, cy = cv.height*0.56;
  const scale = 5.0;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  drawHead(ctx, glad, 0, 26.5, glad.skinColor, '#c98d63', false, {},
    { hp:100, max:100, lost:false, ratio:1 });
  ctx.restore();
  return ctx;
}

const face = document.getElementById('face');
const ctx = renderFace(face, base);

// --- Сравнение: пиксель (x,y) против зеркального (2*cx - 1 - x, y) ---
const W = face.width, H = face.height;
const midX = W / 2;
const img = ctx.getImageData(0, 0, W, H);
const d = img.data;
const diffCv = document.getElementById('diff');
const dctx = diffCv.getContext('2d');
const out = dctx.createImageData(W, H);
const o = out.data;

let maxDiff = 0, sumDiff = 0, count = 0;
let maxAt = null;
// Область глаз: y от 40% до 62% высоты
const y0 = Math.floor(H * 0.38), y1 = Math.floor(H * 0.66);
for (let y = y0; y < y1; y++) {
  for (let x = 0; x < Math.floor(midX); x++) {
    const mx = Math.floor(2 * midX - 1 - x);
    const i1 = (y * W + x) * 4;
    const i2 = (y * W + mx) * 4;
    const dr = Math.abs(d[i1] - d[i2]);
    const dg = Math.abs(d[i1+1] - d[i2+1]);
    const db = Math.abs(d[i1+2] - d[i2+2]);
    const dd = (dr + dg + db) / 3;
    const idx = (y * W + x) * 4;
    o[idx] = Math.min(255, dd * 4);
    o[idx+1] = dd > 30 ? 40 : 0;
    o[idx+2] = dd > 30 ? 40 : 0;
    o[idx+3] = 255;
    if (dd > maxDiff) { maxDiff = dd; maxAt = {x, y}; }
    sumDiff += dd; count++;
  }
}
// Отразим карту для наглядности
const out2 = dctx.createImageData(W, H);
for (let y = 0; y < H; y++) {
  for (let x = 0; x < W; x++) {
    const sx = x < midX ? x : Math.floor(2 * midX - 1 - x);
    const si = (y * W + sx) * 4;
    const di = (y * W + x) * 4;
    out2.data[di] = o[si];
    out2.data[di+1] = o[si+1];
    out2.data[di+2] = o[si+2];
    out2.data[di+3] = 255;
  }
}
dctx.putImageData(out2, 0, 0);

document.getElementById('rep').textContent =
  `макс. разница: ${maxDiff.toFixed(1)} в (${maxAt ? maxAt.x : '-'}, ${maxAt ? maxAt.y : '-'})\n` +
  `средняя разница: ${(sumDiff / count).toFixed(2)}\n` +
  `пикселей: ${count}`;
</script>
</body>
</html>
