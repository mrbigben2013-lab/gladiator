<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>bow mirror</title>
<style>
  body { background:#3a2f22; margin:0; padding:8px; font-family:Segoe UI, sans-serif; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  .cap { font-size:12px; color:#c9a45c; text-align:center; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script src="data.js"></script>
<script src="renderer.js"></script>
<script>
  const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
  function makeGlad(weaponId) {
    return {
      id: 'tg', name: 'Тест', gender: 'male', build: 'normal',
      skinColor: '#e8ab7e', hairColor: '#4a3018',
      hairStyle: 'short', beardStyle: 'stubble',
      equip: { weapon: itemById(weaponId), offhand: null, head: null,
               body: { vis: 'leather', color: '#6b4529' }, arms: null, legs: null },
      limbs: null
    };
  }
  const cases = [
    ['w_shortbow', 1, 'вправо'],
    ['w_shortbow', -1, 'влево'],
    ['w_recurve', -1, 'влево'],
    ['w_light_xbow', -1, 'арбалет влево'],
  ];
  cases.forEach(([id, facing, label]) => {
    const wrap = document.createElement('div');
    const cv = document.createElement('canvas');
    cv.width = 320; cv.height = 380;
    wrap.appendChild(cv);
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = itemById(id).name + ' / ' + label;
    wrap.appendChild(cap);
    document.getElementById('row').appendChild(wrap);
    const ctx = cv.getContext('2d');
    ctx.save();
    ctx.translate(160, 20);
    ctx.scale(1.7, 1.7);
    drawBattleBrother(ctx, makeGlad(id), 0, 190, 1, facing, {});
    ctx.restore();
  });
</script>
</body>
</html>
