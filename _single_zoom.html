<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>single zoom</title>
<style>
  body { background:#1b1512; margin:0; padding:10px; font-family:Segoe UI, sans-serif; color:#e8d8c0; }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  .cell { text-align:center; }
  .cap { font-size:12px; color:#c9a45c; }
  #err { color:#ff8a7a; font-size:12px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="err"></div>
<div class="row" id="row"></div>
<script src="data.js"></script>
<script src="renderer.js"></script>
<script>
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  function makeGlad(over) {
    return Object.assign({
      id: 'tg', name: 'Тест', gender: 'male', build: 'normal',
      skinColor: '#e8ab7e', hairColor: '#4a3018',
      hairStyle: 'short', beardStyle: 'none',
      equip: { weapon: null, offhand: null, head: null, body: null, arms: null, legs: null },
      limbs: null
    }, over);
  }
  const cases = [
    ['male', { gender:'male' }],
    ['male muscular', { gender:'male', build:'muscular' }],
    ['female', { gender:'female', hairStyle:'long', skinColor:'#f5c9a4' }],
    ['female muscular', { gender:'female', build:'muscular', hairStyle:'braids' }]
  ];
  cases.forEach(([label, over]) => {
    const wrap = document.createElement('div');
    wrap.className = 'cell';
    const cv = document.createElement('canvas');
    cv.width = 330; cv.height = 640;
    wrap.appendChild(cv);
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = label;
    wrap.appendChild(cap);
    document.getElementById('row').appendChild(wrap);
    const ctx = cv.getContext('2d');
    try {
      ctx.save();
      ctx.translate(165, 620);
      ctx.scale(4.0, 4.0);
      drawBattleBrother(ctx, makeGlad(over), 0, 0, 1, 1, { emotion: 'idle' });
      ctx.restore();
    } catch (e) { document.getElementById('err').textContent += label + ': ' + e.message + '\n'; }
  });
</script>
</body>
</html>
