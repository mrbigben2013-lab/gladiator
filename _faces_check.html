<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Формы лиц</title>
<style>
  body { margin: 0; background: #14100d; color: #e8dcc8; font: 12px "Segoe UI", sans-serif; padding: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  figure { margin: 0; }
  canvas { background: radial-gradient(circle at 50% 42%, #3a2e24, #14100d); border: 1px solid #4a3a28; border-radius: 8px; }
  figcaption { text-align: center; padding: 4px; color: #b9a687; font-size: 11px; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script src="data.js"></script>
<script>window.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };</script>
<script src="renderer.js"></script>
<script>
const row = document.getElementById('row');
const gender = new URLSearchParams(location.search).get('g') || 'male';
const beard = new URLSearchParams(location.search).get('beard') || (gender === 'female' ? 'none' : 'stubble');

FACE_STYLES.forEach(fs => {
  const fig = document.createElement('figure');
  const cv = document.createElement('canvas');
  cv.width = 190; cv.height = 210;
  const cap = document.createElement('figcaption');
  cap.textContent = fs.name;
  fig.appendChild(cv); fig.appendChild(cap);
  row.appendChild(fig);

  const ctx = cv.getContext('2d');
  const g = {
    id: 'face_' + fs.id + '_test',
    name: fs.name, gender, build: 'normal',
    skinColor: '#e8ab7e', hairColor: '#4a3018',
    hairStyle: 'short', beardStyle: beard,
    faceStyle: fs.id,
    equip: {}
  };
  try {
    ctx.save();
    ctx.translate(cv.width / 2, cv.height * 0.52);
    ctx.scale(3.4, 3.4);
    drawHead(ctx, g, 0, 26.5, '#e8ab7e', '#c98d63', gender === 'female', {}, { hp: 100, max: 100, lost: false, ratio: 1 });
    ctx.restore();
  } catch (e) {
    cap.textContent = fs.name + ' ОШИБКА: ' + e.message;
    cap.style.color = '#ff6b5a';
  }
});
</script>
</body>
</html>
